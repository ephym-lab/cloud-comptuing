<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0"
                 style="background:#ffffff;border-radius:8px;padding:32px;">
            <tr>
              <td style="font-size:20px;font-weight:bold;color:#e8711a;padding-bottom:16px;">
                {{ app_name }}
              </td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.5;">
                {% block body %}{% endblock %}
              </td>
            </tr>
            <tr>
              <td style="padding-top:24px;font-size:12px;color:#7b8794;">
                If the button doesn't work, copy this link into your browser:<br>
                <span style="word-break:break-all;">{{ link }}</span>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
