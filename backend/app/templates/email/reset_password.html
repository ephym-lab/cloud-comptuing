{% extends "email/_layout.html" %}
{% block body %}
<p>Hi {{ name }},</p>
<p>We received a request to reset your password.</p>
<p style="padding:8px 0;">
  <a href="{{ link }}"
     style="background:#e8711a;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:6px;display:inline-block;">
    Reset password
  </a>
</p>
<p>This link expires in {{ expires_in }} and can be used once. If you didn't request this, you can ignore this email — your password won't change.</p>
{% endblock %}
