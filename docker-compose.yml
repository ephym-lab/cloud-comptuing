services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-s3demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-s3demo}
      POSTGRES_DB: ${POSTGRES_DB:-s3demo}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The frontend service is added in the frontend phase.

volumes:
  pgdata:
